<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9423a">
<title>Caisse à Outils</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête rouge collant (titre + onglets d'outils défilants), une carte de calcul par outil, chiffres en mono */
:root{
  --red:#d9423a; --on-red:#fff; --on-red-dim:rgba(255,255,255,.72);
  --bg:#f1efee; --card:#ffffff; --fg:#2b2726; --muted:#76706d; --line:#d9d4d1; --field:#f8f6f5; --chip:#ece8e6;
  --ok:#2f7d4f; --bad:#b8322b; --calc:#fbeeed; --calc-fg:#a8302a; --ink:#3d3735; --tri:#f7e3e1;
  --kfn:#4a4442; --kfn-fg:#ffffff; --hl2:#1f6fd6; --m-shank:#cfcac7; --m-land:#aea8a5; --m-margin:#e6e2df; --m-flute:#5f5856; --m-edge:#4a4442; --hl:#f0a8a2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#c63c34; --bg:#171413; --card:#221e1d; --fg:#eeeae8; --muted:#a49d9a; --line:#3a3432; --field:#1b1817; --chip:#2e2927;
  --ok:#6cc08f; --bad:#f08a83; --calc:#3a2321; --calc-fg:#f4a39d; --ink:#e6e0dd; --tri:#3a2422;
  --kfn:#3e3836; --kfn-fg:#f2eeec; --hl2:#6aa7ff; --m-shank:#8c8683; --m-land:#6c6664; --m-margin:#b4aeab; --m-flute:#2a2625; --m-edge:#cfc8c5; --hl:#a8443d; color-scheme:dark}}
:root[data-theme="dark"]{--red:#c63c34; --bg:#171413; --card:#221e1d; --fg:#eeeae8; --muted:#a49d9a; --line:#3a3432; --field:#1b1817; --chip:#2e2927;
  --ok:#6cc08f; --bad:#f08a83; --calc:#3a2321; --calc-fg:#f4a39d; --ink:#e6e0dd; --tri:#3a2422;
  --kfn:#3e3836; --kfn-fg:#f2eeec; --hl2:#6aa7ff; --m-shank:#8c8683; --m-land:#6c6664; --m-margin:#b4aeab; --m-flute:#2a2625; --m-edge:#cfc8c5; --hl:#a8443d; color-scheme:dark}
input,textarea,select,button{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px}
body::before{content:"";position:fixed;top:0;left:0;right:0;top:0;right:0;bottom:0;left:0;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);color:var(--on-red);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.bar{display:flex;align-items:center;justify-content:space-between;padding-top:8px;padding-bottom:0;padding-block:8px 0;padding-left:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-right:16px;right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.01em;margin:0}
.bar small{font-family:var(--num);font-size:.72rem;color:var(--on-red-dim)}
nav{display:flex;overflow-x:auto;scrollbar-width:none;padding-left:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:8px;padding-right:max(8px,env(safe-area-inset-right,0px))}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:88px;background:none;border:0;color:var(--on-red-dim);font:600 .8rem var(--body);text-transform:uppercase;letter-spacing:.06em;padding:2px 10px 5px;border-bottom:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button[aria-selected="true"]{color:var(--on-red);border-bottom-color:var(--on-red)}
nav button:focus-visible{outline:2px solid var(--on-red);outline-offset:-4px}
.ic{height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:500;text-transform:none;letter-spacing:0}
.ic-pm{display:flex;align-items:center;gap:3px}
.ic-pm .st{display:flex;flex-direction:column;line-height:.85;font-size:1rem;text-align:center}
.ic-pm .pc{font-size:1.35rem}
.ic svg{width:30px;height:24px}
/* En-tête fixe qui se compacte au défilement */
header{position:fixed;left:0;right:0}
header .bar,header h1,header nav button,.ic{transition:all .2s ease}
header.compact .bar{display:none}
header.compact .lbl{display:none}
header.compact nav button{padding:3px 10px 3px;min-width:64px;gap:0;border-bottom-width:2px}
header.compact .ic{height:20px;transform:scale(.72)}
@media (prefers-reduced-motion:reduce){header .bar,header h1,header nav button,.ic{transition:none}}
main{max-width:600px;margin:0 auto;padding-top:calc(var(--hh,128px) + 12px);padding-bottom:40px;padding-block:calc(var(--hh,128px) + 12px) 40px;padding-left:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-right:16px;right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:.9rem;margin:-6px 0 0}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);align-items:center;gap:12px}
.row label{font-weight:600;color:var(--muted)}
.inp{display:flex;align-items:center;gap:8px;min-width:0}
input{width:100%;min-width:0;font:500 1.15rem var(--num);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-variant-numeric:tabular-nums}
input:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
input.calc{background:var(--calc);color:var(--calc-fg);border-color:transparent}
.unit{font:500 1rem var(--num);color:var(--muted);min-width:2ch}
.pair{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px}
.sign{grid-row:span 2;width:56px;border:1px solid var(--line);background:var(--chip);border-radius:4px;font:500 1.6rem var(--num);color:var(--fg);cursor:pointer}
.sign.plus{color:var(--ok)} .sign.minus{color:var(--bad)}
.sign:focus-visible{outline:2px solid var(--red)}
.pair .inp+.inp{margin-top:8px}
.lbls{display:grid;gap:8px;align-content:center}
.lbls label{display:flex;align-items:center;min-height:48px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:8px 14px;font:600 .85rem var(--body);cursor:pointer}
.btn:hover{border-color:var(--red)}
.tag{font:400 .78rem var(--num);color:var(--muted)}
.tag.err{color:var(--bad)}
/* Trigo */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;color:var(--muted);font:500 .9rem var(--num);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* Le triangle reste visible pendant la saisie */
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hc,52px));z-index:2;background:var(--card);margin-left:-18px;margin-right:-18px;margin-inline:-18px;padding:4px 18px 6px;border-bottom:1px solid transparent}
.stage.stuck{border-bottom-color:var(--line)}
.stage svg{display:block;width:100%;height:auto;max-height:38vh;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
.zbtn{position:absolute;top:8px;right:18px;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:5px 11px;font:500 .78rem var(--num);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.zbtn:focus-visible{outline:2px solid var(--red)}
.zhint{position:absolute;bottom:6px;right:18px;font:400 .68rem var(--num);color:var(--muted);pointer-events:none}
.zbtn:not([hidden])~.zhint{display:none}
.hit{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fields{display:grid;gap:10px}
.line{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.line.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.f{display:grid;gap:3px;min-width:0}
.f label{font-size:.72rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f label b{font-family:var(--num);color:var(--fg);font-weight:500;font-size:.9rem;margin-right:3px}
.f .inp{gap:4px}
.f input{font-size:1rem;padding:9px 8px}
.f .unit{font-size:.8rem;min-width:auto}
.f.on label b{color:var(--red)}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv{background:var(--chip);border-radius:4px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kv strong{font:500 1rem var(--num);word-break:break-all}
.formulas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font:400 .85rem var(--num);color:var(--muted)}
.formulas div{text-align:center;padding:6px 4px;border:1px dashed var(--line);border-radius:4px}
@media (max-width:400px){.extra,.formulas{grid-template-columns:1fr 1fr}}
/* Taraudage */
.tapsel{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hc,52px));z-index:2;background:var(--card);margin-left:-18px;margin-right:-18px;margin-inline:-18px;padding:6px 18px 10px;border-bottom:1px solid var(--line)}
.tapsel{grid-template-columns:1.15fr .95fr 1.3fr}
.big{background:var(--chip);border-radius:6px;padding:8px 10px;min-width:0;container-type:inline-size;position:relative}
.big span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big strong{display:block;font:600 1.05rem var(--num);font:600 clamp(.85rem,17cqi,1.35rem) var(--num);white-space:nowrap;overflow:hidden;text-overflow:clip}
.big small{font-size:.72em;color:var(--muted)}
.big.pick{cursor:pointer;border:1px solid var(--line)}
.big.pick span::after{content:" ▾";color:var(--red)}
.big.pick select{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.big.pick:focus-within{outline:2px solid var(--red);outline-offset:1px}
.big.main{background:var(--red);color:#fff}
.big.main span,.big.main small{color:rgba(255,255,255,.8)}
.taplist{display:grid;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.taprow{display:grid;grid-template-columns:1.1fr .8fr 1fr;align-items:center;gap:8px;padding:11px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--fg);font:500 1rem var(--num);text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.taprow:nth-child(2){border-top:0}
.taprow.head{border-top:0;background:var(--chip);font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:default;padding-top:8px;padding-bottom:8px;padding-block:8px}
.taprow .tn{display:flex;align-items:center;gap:6px;font-weight:600}
.taprow .dr{color:var(--calc-fg)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-left:-12px}
.taprow[aria-current="true"]{background:var(--calc)}
.taprow:not(.head):hover{background:var(--field)}
.taprow[aria-current="true"]:hover{background:var(--calc)}
.taprow:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
/* Forets */
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hc,52px));z-index:3;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--bg);margin-left:-16px;margin-right:-16px;margin-inline:-16px;padding:4px 12px;border-bottom:1px solid var(--line)}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;background:none;border:0;border-radius:999px;color:var(--muted);font:600 .74rem var(--body);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;cursor:pointer;white-space:nowrap}
.subnav button[aria-selected="true"]{color:var(--red);background:var(--calc)}
.subnav button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.dpanels{display:grid;gap:12px}
.iso3d{position:relative;margin-left:-6px;margin-right:-6px;margin-inline:-6px;min-height:60px}
.iso3d canvas{display:block}
.iso3d-tag{position:absolute;left:6px;top:0;font:400 .68rem var(--num);color:var(--muted);pointer-events:none}
.anat{display:grid;gap:10px}
.anat svg{display:block;width:100%;height:auto}
.views{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;align-items:center}
.vcap{font:600 .68rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 11px;font:500 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.def{background:var(--chip);border-radius:6px;padding:12px 14px;display:grid;gap:4px;min-height:88px}
.def strong{font-family:var(--display);font-size:1.15rem;font-weight:600}
.def em{font:400 .75rem var(--num);color:var(--muted);font-style:normal}
.def p{margin:0;font-size:.93rem;line-height:1.45}
.pf{transition:fill .15s}
.pf.on{fill:var(--hl)}
.pm.on{fill:var(--red)}
.ps.on{stroke:var(--red)}
.pl{stroke:var(--muted);stroke-width:1;fill:none}
.pl.on{stroke:var(--red);stroke-width:2.2}
.pt{fill:var(--muted);font:500 9px var(--num)}
.pt.on{fill:var(--red);font-weight:600}
.hitz{cursor:pointer}
details.sec{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.2rem}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font:500 1.3rem var(--num);color:var(--red)}
details.sec[open]>summary::after{content:"−"}
details.sec>summary:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.secb{padding:0 18px 18px;display:grid;gap:10px}
.secb>p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item h3{margin:0;font:600 1rem var(--body)}
.item .sub{font:400 .75rem var(--num);color:var(--muted)}
.item p{margin:0;font-size:.9rem;line-height:1.45;grid-column:2}
.item .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.item .meta span{font:400 .72rem var(--num);background:var(--chip);border-radius:3px;padding:2px 6px}
.sw{width:34px;height:34px;border-radius:6px;grid-row:span 3;border:1px solid rgba(0,0,0,.15);box-shadow:inset 0 8px 10px -6px rgba(255,255,255,.55),inset 0 -8px 10px -6px rgba(0,0,0,.35)}
.iso{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.isoc{border-radius:6px;padding:10px;color:#fff;min-width:0}
.isoc b{font:600 1.6rem var(--num);display:block;line-height:1}
.isoc span{font-size:.8rem;line-height:1.3;display:block;margin-top:4px}
.isoc.dk{color:#2b2726}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-family:var(--num);font-weight:500;white-space:nowrap}
.note{font-size:.78rem;color:var(--muted);margin:0}
@media (max-width:420px){.views{grid-template-columns:1fr}.views>div:last-child{max-width:220px;margin:0 auto;width:100%}.iso{grid-template-columns:1fr 1fr}}
/* Titre + version + recherche */
.bar{gap:12px;position:relative}
.brand{display:flex;align-items:baseline;gap:5px;flex:0 0 auto}
h1{font-size:1.4rem;font-size:clamp(1.1rem,4.8vw,1.55rem);white-space:nowrap}
.ver{font:400 .6rem var(--num);color:var(--on-red-dim)}
.search{position:relative;flex:1 1 0;max-width:360px;min-width:96px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--on-red-dim);pointer-events:none}
.search input{height:34px;padding:0 10px 0 31px;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.16);color:var(--on-red);font:500 .95rem var(--body);transition:height .2s,background .15s}
.search input::placeholder{color:var(--on-red-dim);opacity:1}
.search input:focus{outline:none;background:var(--card);color:var(--fg);border-color:transparent}
.search:focus-within svg{color:var(--muted)}
header.compact .ver{display:none}
header.compact .search input{height:28px;font-size:.85rem}
.sugg{position:absolute;top:100%;right:16px;right:max(16px,env(safe-area-inset-right,0px));width:480px;max-width:calc(100% - 32px);width:min(480px,calc(100% - 32px));margin-top:4px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);max-height:60vh;max-height:min(60vh,440px);overflow-y:auto;z-index:20;padding:4px}
.sg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--fg);cursor:pointer}
.sg[aria-selected="true"]{background:var(--calc)}
.sgt{font:600 .95rem var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgk{font:600 .64rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--red);align-self:center}
.sgs{grid-column:1/-1;font:400 .78rem var(--num);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgn{padding:12px;font-size:.88rem;color:var(--muted)}
/* Calculatrice */
.cx{padding:12px;gap:8px}
.histw{position:relative}
.hist{height:150px;height:clamp(110px,calc(100dvh - var(--hh,128px) - 490px),420px);overflow-y:auto;border:1px solid var(--line);border-radius:6px;background:var(--field);display:flex;flex-direction:column}
.hist>:first-child{margin-top:auto}
.hempty{margin:auto;padding:12px;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.5}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;font:500 1.15rem var(--num);color:var(--fg);cursor:pointer;word-break:break-all;font-variant-numeric:tabular-nums}
.hrow.res{background:var(--calc);color:var(--calc-fg);font-weight:600;min-height:42px}
.hrow small{font:400 .78rem var(--num);color:var(--muted);word-break:normal}
.hrow:hover{filter:brightness(.97)}
.hrow:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.1;font-size:.9em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 3px 1px}
.frac>span:last-child{padding:1px 3px 0}
.hclr{position:absolute;top:6px;right:6px;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font:500 .72rem var(--body);cursor:pointer}

<script>
/* Démarrage sûr : si l'application ne peut pas se lancer (navigateur interne trop ancien,
   erreur JavaScript...), on affiche le motif au lieu d'une page blanche.
   Volontairement écrit en JavaScript ancien pour fonctionner même sur un très vieux WebView. */
(function(){
  var erreurs = [];
  window.onerror = function(msg, src, lig){ erreurs.push(String(msg) + "  (" + String(src || "") + " ligne " + (lig || 0) + ")"); return false; };
  function moteur(){ var m = / (?:Chrome|CriOS)\/(\d+)/.exec(navigator.userAgent); return m ? parseInt(m[1], 10) : 0; }
  function detail(){
    var v = document.querySelector(".ver");
    var t = "Caisse à Outils " + (v ? v.textContent : "?") + " - démarrage impossible\n";
    t += "Moteur : Chrome " + (moteur() || "inconnu") + "\n";
    t += "Écran : " + screen.width + "x" + screen.height + "\n";
    t += "Navigateur : " + navigator.userAgent + "\n";
    if (!erreurs.length) t += "\nAucune erreur JavaScript signalée.";
    for (var i = 0; i < erreurs.length && i < 6; i++) t += "\nErreur " + (i + 1) + " : " + erreurs[i] + "\n";
    return t;
  }
  function afficher(){
    if (window.__CO_OK) return;
    var hote = document.getElementById("view") || document.body;
    var vieux = moteur() && moteur() < 80;
    var h = '<div style="margin:16px auto;max-width:640px;background:#fff;color:#2b2726;border:1px solid #d9d4d1;border-radius:10px;padding:18px;font:16px/1.45 system-ui,-apple-system,sans-serif">';
    h += '<h2 style="margin:0 0 10px;font:600 20px system-ui,sans-serif">L\'application n\'a pas pu démarrer</h2>';
    if (vieux) {
      h += '<p style="margin:0 0 10px">Le navigateur interne de cet appareil est trop ancien (Chrome ' + moteur() + ') pour faire tourner la Caisse à Outils.</p>';
      h += '<p style="margin:0 0 10px"><b>À faire :</b> ouvrir le Play Store, chercher <b>Android System WebView</b>, le mettre à jour, puis faire de même avec <b>Google Chrome</b>. Rouvrir ensuite la Caisse à Outils.</p>';
    } else {
      h += '<p style="margin:0 0 10px">Une erreur a empêché le chargement. Le détail ci-dessous permet de la corriger.</p>';
    }
    h += '<p style="margin:0 0 6px;color:#76706d;font-size:14px">Détail à envoyer :</p>';
    h += '<textarea readonly style="width:100%;box-sizing:border-box;height:150px;font:12px/1.4 monospace;border:1px solid #d9d4d1;border-radius:8px;padding:8px;background:#f8f6f5;color:#2b2726"></textarea>';
    h += '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">';
    h += '<button id="coCopie" style="flex:1 1 140px;min-height:44px;border:0;border-radius:8px;background:#d9423a;color:#fff;font:600 15px system-ui,sans-serif">Copier le détail</button>';
    h += '<button id="coRetry" style="flex:1 1 140px;min-height:44px;border:1px solid #d9d4d1;border-radius:8px;background:#fff;color:#2b2726;font:600 15px system-ui,sans-serif">Réessayer</button>';
    h += '</div></div>';
    hote.innerHTML = h;
    var ta = hote.getElementsByTagName("textarea")[0];
    ta.value = detail();
    document.getElementById("coCopie").onclick = function(){
      try { ta.focus(); ta.select(); document.execCommand("copy"); this.innerHTML = "Copié"; }
      catch (e) { this.innerHTML = "Sélectionne le texte puis Copier"; }
    };
    document.getElementById("coRetry").onclick = function(){ location.reload(); };
  }
  /* Chrome < 84 : « gap » ne fonctionne pas en flexbox (il marche déjà en grille).
     On relit les feuilles de style et on remplace ces écarts par des marges. */
  function gapFlexDispo(){
    var t = document.createElement("div");
    t.style.cssText = "display:flex;gap:12px;position:absolute;visibility:hidden";
    t.appendChild(document.createElement("i"));
    t.appendChild(document.createElement("i"));
    document.body.appendChild(t);
    var ok = t.offsetWidth >= 12 || t.scrollWidth >= 12;
    t.parentNode.removeChild(t);
    return ok;
  }
  function demi(v){
    var m = /^(-?[0-9.]+)([a-z%]*)$/.exec(String(v || "").trim());
    if (!m) return "0px";
    return (parseFloat(m[1]) / 2) + (m[2] || "px");
  }
  function collecte(liste, sortie){
    for (var i = 0; i < liste.length; i++) {
      var r = liste[i];
      if (r.media && r.cssRules) {
        var sous = [];
        collecte(r.cssRules, sous);
        if (sous.length) sortie.push("@media " + (r.conditionText || r.media.mediaText) + "{" + sous.join("") + "}");
        continue;
      }
      if (r.cssRules && !r.selectorText) { collecte(r.cssRules, sortie); continue; }
      if (!r.style || !r.selectorText) continue;
      if ((r.style.display || "").indexOf("flex") < 0) continue;
      var g = r.style.gap || "", rg = r.style.rowGap || "", cg = r.style.columnGap || "";
      if (g) { var p = g.split(/\s+/); rg = p[0]; cg = p[1] || p[0]; }
      if (!rg && !cg) continue;
      sortie.push(r.selectorText.replace(/(^|,)\s*/g, "$1html.sansgapflex ") + ">*{margin:" + demi(rg || cg) + " " + demi(cg || rg) + "}");
    }
  }
  function reparerGap(){
    try {
      if (gapFlexDispo()) return;
      var sortie = [];
      for (var i = 0; i < document.styleSheets.length; i++) {
        var regles = null;
        try { regles = document.styleSheets[i].cssRules; } catch (e) { continue; }
        if (regles) collecte(regles, sortie);
      }
      if (!sortie.length) return;
      var st = document.createElement("style");
      st.appendChild(document.createTextNode(sortie.join("\n")));
      document.head.appendChild(st);
      document.documentElement.className += " sansgapflex";
    } catch (e) {}
  }
  if (window.addEventListener) window.addEventListener("DOMContentLoaded", reparerGap, false);

  function plusTard(){ setTimeout(afficher, 1500); }
  if (window.addEventListener) window.addEventListener("load", plusTard, false);
  else window.attachEvent("onload", plusTard);
})();
</script>

<script>
// ---------- Utilitaires nombres (format FR, virgule acceptée) ----------
const parse = v => { const s=String(v==null?'':v).replace(/\s/g,'').replace(',', '.'); return s===''?NaN:Number(s); };
const fmt = (n,max=2) => !isFinite(n) ? '—' : n.toLocaleString('fr-FR',{maximumFractionDigits:max});
const fmtIn = (n,d=2) => !isFinite(n) ? '' : String(Math.round(n*10**d)/10**d).replace('.', ',');
const el = h => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null} }

// ---------- Registre des outils ----------
const TOOLS = [
  {id:'calc', label:'Calcul', icon:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="1.5" width="14" height="21" rx="2"/><path d="M11 6.5 H19" stroke-width="2.4"/><g fill="currentColor" stroke="none"><circle cx="12" cy="11.5" r="1.3"/><circle cx="15" cy="11.5" r="1.3"/><circle cx="18" cy="11.5" r="1.3"/><circle cx="12" cy="15" r="1.3"/><circle cx="15" cy="15" r="1.3"/><circle cx="18" cy="15" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/><circle cx="15" cy="18.5" r="1.3"/><circle cx="18" cy="18.5" r="1.3"/></g></svg>', render:renderCalc},

  {id:'drill', label:'Forets', icon:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9 H11 V15 H2 Z"/><path d="M11 9 H23 L28 12 L23 15 H11"/><path d="M13 9 L16 15 M17 9 L20 15 M21 9 L23.5 13.5" stroke-width="1.5"/></svg>', render:renderDrill},

  {id:'prof', label:'Profilés', icon:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3 H23 V7 H17 V17 H23 V21 H7 V17 H13 V7 H7 Z"/></svg>', render:renderProf},
  {id:'cont', label:'Conteneurs', icon:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 9 L9 4.5 H28 L21 9 Z"/><path d="M2 9 H21 V21 H2 Z"/><path d="M21 9 L28 4.5 V16.5 L21 21"/><path d="M5 11.5V18.5M8 11.5V18.5M11 11.5V18.5M14 11.5V18.5M17 11.5V18.5" stroke-width="1.2"/><path d="M23.3 9.6V18.6M25.8 8V17" stroke-width="1.4"/></svg>', render:renderCont},
  {id:'trigo', label:'Trigo', icon:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21 H27 V3 Z" stroke-linejoin="round"/><path d="M22 21 V16 H27" stroke-width="1.5"/></svg>', render:renderTrigo},
];
const tabs=document.getElementById('tabs'); let view=document.getElementById('view');
const TAB_ORD=(store('tabOrder')||'').split(',').filter(Boolean);
// un onglet nouveau se place à côté de son voisin naturel (Éléments à droite de Matières)
if(TAB_ORD.length&&!TAB_ORD.includes('per')){ const i=TAB_ORD.indexOf('mat'); TAB_ORD.splice(i<0?TAB_ORD.length:i+1,0,'per'); }
[...TOOLS].sort((a,b)=>{ const ia=TAB_ORD.indexOf(a.id), ib=TAB_ORD.indexOf(b.id); return (ia<0?99:ia)-(ib<0?99:ib); }).forEach(t=>{
  const b=document.createElement('button'); b.role='tab'; b.id='tab-'+t.id;
  b.setAttribute('aria-label',t.aria||t.label);
  b.innerHTML=`<span class="ic">${t.icon}</span><span class="lbl">${t.label}</span>`; b.onclick=()=>show(t.id); tabs.appendChild(b);
});
// Appui long sur un onglet : on le fait glisser à une autre place (ordre mémorisé)
(function tabDrag(){
  let lp=null, drag=null, skip=false;
  const btns=()=>[...tabs.querySelectorAll('button[role=tab]')];
  tabs.addEventListener('pointerdown',e=>{ const b=e.target.closest('button[role=tab]'); if(!b||e.button>0) return;
    lp={b,x:e.clientX,y:e.clientY,t:setTimeout(()=>{ drag={b}; lp=null; b.classList.add('dragging'); tabs.classList.add('reorder'); try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} try{ b.setPointerCapture(e.pointerId); }catch(_){} },450)}; });
  tabs.addEventListener('pointermove',e=>{
    if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){ clearTimeout(lp.t); lp=null; }
    if(!drag) return; e.preventDefault();
    const x=e.clientX, others=btns().filter(o=>o!==drag.b); let target=null;
    for(const o of others){ const r=o.getBoundingClientRect(); if(x<r.left+r.width/2){ target=o; break; } }
    if(target){ if(drag.b.nextElementSibling!==target) tabs.insertBefore(drag.b,target); } else if(tabs.lastElementChild!==drag.b) tabs.appendChild(drag.b);
    const R=tabs.getBoundingClientRect(); if(x<R.left+36) tabs.scrollLeft-=10; else if(x>R.right-36) tabs.scrollLeft+=10; });
  const end=()=>{ if(lp){ clearTimeout(lp.t); lp=null; } if(!drag) return;
    drag.b.classList.remove('dragging'); tabs.classList.remove('reorder'); skip=true; setTimeout(()=>skip=false,400);
    store('tabOrder',btns().map(b=>b.id.slice(4)).join(',')); drag=null; };
  tabs.addEventListener('pointerup',end); tabs.addEventListener('pointercancel',end);
  tabs.addEventListener('touchmove',e=>{ if(drag) e.preventDefault(); },{passive:false});
  tabs.addEventListener('click',e=>{ if(skip){ e.stopPropagation(); e.preventDefault(); skip=false; } },true);
  tabs.addEventListener('contextmenu',e=>e.preventDefault());
})();
function show(id){
  if(typeof kpClose==='function') kpClose(); document.documentElement.classList.remove('perfull');
  const t=TOOLS.find(x=>x.id===id)||TOOLS[0];
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.id==='tab-'+t.id));
  const fresh=view.cloneNode(false); view.replaceWith(fresh); view=fresh;
  fresh.dataset.tool=t.id; t.render(fresh); store('tab',t.id);
}

function addClear(inp,onClear){

  b.addEventListener('click',()=>{ inp.value=''; onClear&&onClear(); inp.focus(); });
  sync(); return sync;
}
const TVA_RATES=[
 ['20','Taux normal','Taux par défaut : la plupart des biens et des services (outillage, matériaux, machines, vêtements, carburant, boissons alcoolisées, prestations de services…). Les abonnements d\'électricité et de gaz y sont passés le 1er août 2025 (auparavant 5,5 %).'],

];
const TVA_DOM=[
 ['8.5','Taux normal outre-mer','Guadeloupe, Martinique et La Réunion : taux par défaut, comme le 20 % en métropole.'],
 ['2.1','Taux réduit outre-mer','Guadeloupe, Martinique et La Réunion : la plupart des opérations soumises en métropole aux taux de 5,5 % et de 10 % (alimentation, travaux, restauration…).'],

function renderPct(view){
  let tab=store('pctTab')==='tva'?'tva':'pct';
  view.append(el(`<div class="subnav" role="tablist" aria-label="Calculs"><button role="tab" data-pt="pct">Pourcentage</button><button role="tab" data-pt="tva">TVA</button></div>`));
  const PA=el('<div class="dpanels"></div>'), PB=el('<div class="dpanels"></div>'); view.append(PA,PB);
  const showTab=k=>{ tab=k; store('pctTab',k); view.querySelectorAll('[data-pt]').forEach(b=>b.setAttribute('aria-selected',b.dataset.pt===k)); PA.hidden=k!=='pct'; PB.hidden=k!=='tva'; };
  view.querySelector('.subnav').addEventListener('click',e=>{ const b=e.target.closest('[data-pt]'); if(b) showTab(b.dataset.pt); });

  // --- Pourcentage : on remplit 2 champs, les autres se calculent ---
  PA.append(el(`<section class="card">
    <h2>Calcul de pourcentage</h2>
    <p class="hint">Remplis deux champs, les autres se calculent. La croix vide une case pour en saisir une autre. Touche le signe pour passer de − à +.</p>
    <div class="row"><label for="cA">Valeur de départ</label><div class="inp"><input id="cA" inputmode="decimal"></div></div>
    <div class="row"><div class="lbls"><label for="cP">Pourcentage</label><label for="cD">Différence</label></div>
      <div class="pair"><button class="sign" id="cS" aria-label="Changer le signe"></button>
        <div class="inp"><input id="cP" inputmode="decimal"><span class="unit">%</span></div>
        <div class="inp"><input id="cD" inputmode="decimal"><span class="unit"></span></div></div></div>
    <div class="row"><label for="cF">Valeur finale</label><div class="inp"><input id="cF" inputmode="decimal"></div></div>
    <div class="foot"><span class="tag" id="cInfo"></span><button class="btn" id="cR">Tout effacer</button></div>
  </section>`));
  const F={A:cA,P:cP,D:cD,F:cF}; let s=-1, order=[]; const syncs=[];
  const paint=()=>{ cS.textContent=s>0?'+':'−'; cS.className='sign '+(s>0?'plus':'minus'); };
  function solve(){
    const k=order.filter(x=>isFinite(parse(F[x].value))).slice(-2);
    for(const x in F) F[x].classList.toggle('calc', k.length===2 && !k.includes(x));
    cInfo.textContent = k.length<2 ? 'Encore '+(2-k.length)+' champ à remplir' : 'Calculé depuis : '+k.map(x=>({A:'départ',P:'%',D:'différence',F:'finale'})[x]).join(' + ');
    if(k.length===2){
      const has=x=>k.includes(x), g=x=>has(x)?parse(F[x].value):NaN;
      let A=g('A'),P=g('P'),D=g('D'),Fi=g('F');
      if(has('A')&&has('F')){ D=Math.abs(Fi-A); if(Fi!==A){s=Fi>A?1:-1;paint();} P=D/A*100; }
      else if(has('A')&&has('P')){ D=A*P/100; Fi=A+s*D; }
      else if(has('A')&&has('D')){ P=D/A*100; Fi=A+s*D; }
      else if(has('P')&&has('D')){ A=D*100/P; Fi=A+s*D; }
      else if(has('P')&&has('F')){ A=Fi/(1+s*P/100); D=A*P/100; }
      else { A=Fi-s*D; P=D/A*100; }
      const v={A,P,D,F:Fi}; for(const x in F) if(!has(x)) F[x].value=fmtIn(v[x]);
    }

  }

  const clearOne=key=>{ order=order.filter(x=>x!==key&&isFinite(parse(F[x].value))); if(order.length>1) order=order.slice(-1);
    for(const x in F) if(!order.includes(x)){ F[x].value=''; F[x].classList.remove('calc'); } solve(); };
  Object.entries(F).forEach(([key,inp])=>{ inp.addEventListener('input',()=>{ order=order.filter(x=>x!==key); order.push(key); solve(); }); syncs.push(addClear(inp,()=>clearOne(key))); });
  cS.onclick=()=>{ s=-s; paint(); const k=order.filter(x=>isFinite(parse(F[x].value))).slice(-2); if(k.includes('A')&&k.includes('F')) order=order.filter(x=>x!=='F'); solve(); };
  cR.onclick=()=>{ for(const x in F){F[x].value='';F[x].classList.remove('calc');} order=[]; s=-1; paint(); solve(); };
  paint(); cA.value='120'; cP.value='25'; order=['A','P']; solve();

  // --- TVA : zone (métropole / outre-mer) puis un taux en grosses tuiles ---
  const ZONES={fr:['Métropole',TVA_RATES],dom:['Outre-mer',TVA_DOM]};
  let zone=store('tvaZone')==='dom'?'dom':'fr';
  const tile=([r,n])=>`<button type="button" class="tvt" data-r="${r}"><b>${fmt(Number(r),2)}<span> %</span></b><small>${esc(n.replace(/^Taux /,'').replace(/ outre-mer$/,''))}</small></button>`;

    <h2>Calcul de TVA</h2>
    <div class="seg tvzone" role="radiogroup" aria-label="Territoire"><button type="button" data-z="fr" role="radio">Métropole et Corse</button><button type="button" data-z="dom" role="radio">Guadeloupe · Martinique · Réunion</button></div>
    <div class="tvgrid" id="tvGrid"></div>
    <p class="tvzn" id="tvZn"></p>
    <div class="row"><label for="tvT">Taux appliqué</label><div class="inp"><input id="tvT" inputmode="decimal"><span class="unit">%</span></div></div>
    <div class="row"><label for="tvH">Montant HT</label><div class="inp"><input id="tvH" inputmode="decimal"><span class="unit">€</span></div></div>
    <div class="row"><label for="tvV">Montant de TVA</label><div class="inp"><input id="tvV" inputmode="decimal"><span class="unit">€</span></div></div>

    <div class="tvdesc" id="tvDesc" aria-live="polite"></div>
    <div class="foot"><span class="tag">TTC = HT × (1 + taux) · HT = TTC ÷ (1 + taux)</span><button class="btn" id="tvR">Tout effacer</button></div>
  </section>`));
  PB.append(el(`<section class="card">
    <h2>À quoi correspondent les taux</h2>
    <h3 class="mh">Métropole</h3>
    ${TVA_RATES.map(([r,n,d])=>`<div class="tvi"><span class="tvp">${fmt(Number(r),2)} %</span><div><h3>${esc(n)}</h3><p>${esc(d)}</p></div></div>`).join('')}

    <p class="note">Guyane et Mayotte : la TVA n'y est pas appliquée. Corse : taux particuliers pour certaines opérations. Les listes ne sont pas exhaustives : le taux dépend de la nature exacte du bien ou du service. En cas de doute, vérifier sur impots.gouv.fr.</p>
    <p class="note">Sources : ${TVA_SRC.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join(' · ')}.</p>
  </section>`));
  const TV={H:tvH,V:tvV,C:tvC}; let last='H'; const tsync=[];
  const rate=()=>parse(tvT.value)/100;
  const paintZone=()=>{ PB.querySelectorAll('[data-z]').forEach(b=>b.setAttribute('aria-checked',b.dataset.z===zone));
    tvGrid.innerHTML=ZONES[zone][1].map(tile).join(''); tvGrid.style.gridTemplateColumns=`repeat(${ZONES[zone][1].length},minmax(0,1fr))`;
    tvZn.textContent=zone==='dom'?'Guyane et Mayotte : pas de TVA (taux 0).':''; };
  function tsolve(){
    const t=rate(), x=parse(TV[last].value);
    for(const k in TV) TV[k].classList.toggle('calc',k!==last&&isFinite(x)&&isFinite(t));
    if(isFinite(t)&&isFinite(x)){ let H=last==='H'?x:last==='C'?x/(1+t):t?x/t:NaN; const v={H,V:H*t,C:H*(1+t)};
      for(const k in TV) if(k!==last) TV[k].value=isFinite(v[k])?fmtIn(v[k]):''; }
    const eq=r=>Math.abs(Number(r[0])-parse(tvT.value))<1e-9;
    const r=ZONES[zone][1].find(eq)||[...TVA_RATES,...TVA_DOM].find(eq);
    PB.querySelectorAll('.tvt').forEach(b=>b.setAttribute('aria-pressed',!!r&&b.dataset.r===r[0]));
    tvDesc.innerHTML=r?`<b>${fmt(Number(r[0]),2)} % · ${esc(r[1])}</b><span>${esc(r[2])}</span>`:isFinite(t)?'<span>Taux personnalisé.</span>':'';
    tsync.forEach(f=>f()); store('tvaRate',tvT.value);
  }
  Object.entries(TV).forEach(([k,inp])=>{ inp.addEventListener('input',()=>{ last=k; tsolve(); });
    tsync.push(addClear(inp,()=>{ for(const j in TV) if(j!==k&&TV[j].classList.contains('calc')) TV[j].value=''; tsolve(); })); });
  tvT.addEventListener('input',tsolve); tsync.push(addClear(tvT,tsolve));
  PB.addEventListener('click',e=>{
    const z=e.target.closest('[data-z]'); if(z){ zone=z.dataset.z; store('tvaZone',zone); paintZone(); tvT.value=ZONES[zone][1][0][0].replace('.',','); tsolve(); return; }

  tvR.onclick=()=>{ for(const k in TV){ TV[k].value=''; TV[k].classList.remove('calc'); } last='H'; tsolve(); };
  paintZone(); tvT.value=(store('tvaRate')||ZONES[zone][1][0][0].replace('.',',')); tvH.value='100'; tsolve();
  showTab(tab);
}

// ---------- TRIGO : triangle rectangle ----------
// Sommets : A en bas à gauche (angle α), C en bas à droite (90°), B en haut à droite (angle β)
// Côtés : a = BC (vertical, opposé à α), b = AC (horizontal, adjacent à α), c = AB (hypoténuse)
function renderTrigo(view){
  const UNITS={mm:1,cm:10,m:1000};
  let unit=store('unit'); if(!UNITS[unit]) unit='mm';
  view.append(el(`<section class="card">
    <div class="toolbar"><h2>Triangle rectangle</h2>
      <div class="seg" role="group" aria-label="Unité">${Object.keys(UNITS).map(u=>`<button data-u="${u}">${u}</button>`).join('')}</div></div>
    <p class="hint">Touche un côté ou un angle du triangle pour le saisir. Deux valeurs suffisent, dont au moins un côté.</p>
    <div class="stage" id="tStage"><svg id="tSvg" viewBox="0 0 360 220" role="img" aria-label="Triangle rectangle : touche un côté ou un angle pour le saisir, pince pour zoomer"></svg>
      <button class="zbtn" id="tZoom" hidden><span id="tZoomLvl">×1</span> · Recentrer</button>
      <span class="zhint">Pince pour zoomer</span></div>
    <div class="fields">
      <div class="line">
        <div class="f"><label for="ta"><b>a</b>opposé</label><div class="inp"><input id="ta" inputmode="decimal"><span class="unit u"></span></div></div>
        <div class="f"><label for="tb"><b>b</b>adjacent</label><div class="inp"><input id="tb" inputmode="decimal"><span class="unit u"></span></div></div>
        <div class="f"><label for="tc"><b>c</b>hypoténuse</label><div class="inp"><input id="tc" inputmode="decimal"><span class="unit u"></span></div></div>
      </div>
      <div class="line two">
        <div class="f"><label for="tal"><b>α</b>angle en A</label><div class="inp"><input id="tal" inputmode="decimal"><span class="unit">°</span></div></div>
        <div class="f"><label for="tbe"><b>β</b>angle en B</label><div class="inp"><input id="tbe" inputmode="decimal"><span class="unit">°</span></div></div>
      </div>
    </div>
    <div class="extra">
      <div class="kv"><span>Angle C</span><strong>90°</strong></div>
      <div class="kv"><span>Périmètre</span><strong id="tPer">—</strong></div>
      <div class="kv"><span>Aire</span><strong id="tAir">—</strong></div>
    </div>
    <div class="foot"><span class="tag" id="tInfo"></span><button class="btn" id="tR">Effacer</button></div>
  </section>`));
  view.append(el(`<section class="card">
    <h2>Rappel des formules</h2>
    <div class="formulas"><div>sin α = a / c</div><div>cos α = b / c</div><div>tan α = a / b</div>
      <div>c² = a² + b²</div><div>α + β = 90°</div><div>Aire = a·b / 2</div></div>
  </section>`));

  const F={a:ta,b:tb,c:tc,al:tal,be:tbe}; let order=[], res=null;
  const sides=['a','b','c'], deg=Math.PI/180;

  function setUnitUI(){ view.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.u===unit)); view.querySelectorAll('.u').forEach(s=>s.textContent=unit); }
  view.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    const f=UNITS[unit]/UNITS[b.dataset.u];   // conversion des longueurs déjà saisies
    sides.forEach(k=>{ const v=parse(F[k].value); if(isFinite(v)) F[k].value=fmtIn(v*f,4); });
    unit=b.dataset.u; store('unit',unit); setUnitUI(); solve();
  });

  function pick(){
    // les 2 dernières valeurs saisies valides, avec au moins un côté et pas deux angles
    const valid=order.filter(x=>isFinite(parse(F[x].value)) && parse(F[x].value)>0);
    for(let i=valid.length-1;i>=0;i--) for(let j=i-1;j>=0;j--){
      const p=[valid[j],valid[i]];
      if(p.some(x=>sides.includes(x))) return p;
    }
    return valid.slice(-1);
  }
  function solve(){
    const k=pick(), info=tInfo; info.className='tag'; res=null;
    for(const x in F) F[x].classList.remove('calc');
    if(k.length<2){ info.textContent= order.length&&k.length===1&&!sides.includes(k[0])?'Il faut au moins un côté':'Encore '+(2-k.length)+' valeur à remplir'; draw(); tPer.textContent=tAir.textContent='—'; return; }
    const v=Object.fromEntries(k.map(x=>[x,parse(F[x].value)]));
    let {a,b,c}=v, al=(v.al!=null?v.al:(v.be!=null?90-v.be:undefined)), err='';
    if(al!=null && !(al>0&&al<90)) err='Un angle doit être entre 0 et 90°';
    else if(a!=null&&b!=null){ c=Math.hypot(a,b); al=Math.atan(a/b)/deg; }
    else if(a!=null&&c!=null){ if(a>=c) err="L'hypoténuse doit être le plus grand côté"; else { b=Math.sqrt(c*c-a*a); al=Math.asin(a/c)/deg; } }
    else if(b!=null&&c!=null){ if(b>=c) err="L'hypoténuse doit être le plus grand côté"; else { a=Math.sqrt(c*c-b*b); al=Math.acos(b/c)/deg; } }
    else if(a!=null){ b=a/Math.tan(al*deg); c=a/Math.sin(al*deg); }
    else if(b!=null){ a=b*Math.tan(al*deg); c=b/Math.cos(al*deg); }
    else { a=c*Math.sin(al*deg); b=c*Math.cos(al*deg); }
    if(err){ info.textContent=err; info.className='tag err'; draw(); tPer.textContent=tAir.textContent='—'; return; }
    res={a,b,c,al,be:90-al};
    for(const x in F) if(!k.includes(x)){ F[x].value=fmtIn(res[x], sides.includes(x)?3:2); F[x].classList.add('calc'); }
    info.textContent='Calculé depuis : '+k.map(x=>({a:'a',b:'b',c:'c',al:'α',be:'β'})[x]).join(' + ');
    tPer.textContent=fmt(a+b+c,3)+' '+unit; tAir.textContent=fmt(a*b/2,3)+' '+unit+'²';
    draw();
  }

  let active=null;
  // ----- Zoom : pincer à deux doigts, glisser à un doigt quand on a zoomé -----
  const VB0={x:0,y:0,w:360,h:220}; let vb={...VB0};
  function setVB(next){
    const w=Math.min(VB0.w,Math.max(VB0.w/40,next.w)), h=w*VB0.h/VB0.w;

    tSvg.style.touchAction=zoomed?'none':'pan-y';

  const ptrs=new Map(); let g=null, moved=false;
  function startGesture(){
    const ctm=tSvg.getScreenCTM(); const k=ctm.a;   // pixels écran par unité
    const O={x:ctm.e+vb.x*k, y:ctm.f+vb.y*ctm.d}; // coin haut-gauche de la vue à l'écran
    const p=[...ptrs.values()];
    const mid={x:p.reduce((s,q)=>s+q.x,0)/p.length, y:p.reduce((s,q)=>s+q.y,0)/p.length};
    const dist=p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0;
    g={k,O,mid,dist,vb:{...vb},m:{x:vb.x+(mid.x-O.x)/k, y:vb.y+(mid.y-O.y)/k}};
  }
  tSvg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    startGesture();
  });
  tSvg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)||!g) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(moved){ for(const id of ptrs.keys()) try{ if(!tSvg.hasPointerCapture(id)) tSvg.setPointerCapture(id); }catch(_){} }
    const p=[...ptrs.values()];
    const mid={x:p.reduce((s,q)=>s+q.x,0)/p.length, y:p.reduce((s,q)=>s+q.y,0)/p.length};
    if(p.length>=2){
      const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); if(!g.dist) return;
      const w=g.vb.w*g.dist/d, k2=g.k*g.vb.w/w;
      setVB({w,x:g.m.x-(mid.x-g.O.x)/k2,y:g.m.y-(mid.y-g.O.y)/k2}); moved=true;
    } else if(vb.w<VB0.w){
      const dx=mid.x-g.mid.x, dy=mid.y-g.mid.y; if(Math.hypot(dx,dy)<6&&!moved) return;
      setVB({w:vb.w,x:g.vb.x-dx/g.k,y:g.vb.y-dy/g.k}); moved=true;
    }
  });
  const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size) startGesture(); else g=null; };
  tSvg.addEventListener('pointerup',endPtr); tSvg.addEventListener('pointercancel',endPtr);
  tSvg.addEventListener('wheel',e=>{   // molette sur ordinateur
    e.preventDefault(); startGesture();
    const ctm=tSvg.getScreenCTM(), k=ctm.a, O={x:ctm.e+vb.x*k,y:ctm.f+vb.y*ctm.d};
    const m={x:vb.x+(e.clientX-O.x)/k, y:vb.y+(e.clientY-O.y)/k}, w=vb.w*Math.exp(e.deltaY*.0025), k2=k*vb.w/w;
    setVB({w,x:m.x-(e.clientX-O.x)/k2,y:m.y-(e.clientY-O.y)/k2});
  },{passive:false});
  tSvg.addEventListener('dblclick',e=>{ e.preventDefault(); setVB({...VB0}); });
  function draw(){
    const W=360,H=220,pad={l:46,r:72,t:24,b:40};
    const r=res||{a:3,b:4,c:5,al:Math.atan(3/4)/deg,be:90-Math.atan(3/4)/deg};
    const sc=Math.min((W-pad.l-pad.r)/r.b,(H-pad.t-pad.b)/r.a);
    const bw=r.b*sc, ah=r.a*sc, ox=pad.l+((W-pad.l-pad.r)-bw)/2, oy=H-pad.b;
    const A=[ox,oy], C=[ox+bw,oy], B=[ox+bw,oy-ah];
    const L=x=>res?fmt(res[x],2)+' '+unit:x, G=x=>res?fmt(res[x],2)+'°':(x==='al'?'α':'β');
    const u=vb.w/W;   // 1 à l'échelle normale, plus petit quand on zoome : textes et zones tactiles gardent leur taille à l'écran
    const sq=Math.min(14*u,bw/4,ah/4), ra=Math.min(30*u,bw/3,ah);
    const arc=(P,start,sweep,rad)=>{const s=start*deg,e=(start+sweep)*deg;return `M${P[0]+rad*Math.cos(s)} ${P[1]-rad*Math.sin(s)} A${rad} ${rad} 0 0 0 ${P[0]+rad*Math.cos(e)} ${P[1]-rad*Math.sin(e)}`;};
    const hx=(A[0]+B[0])/2, hy=(A[1]+B[1])/2, nx=-ah, ny=-bw, nl=Math.hypot(nx,ny)||1;
    const op=res?1:.45, rb=Math.min(26*u,ah/2.5);
    const hl=k=>active===k, sw=k=>hl(k)?6:2.5, aw=k=>hl(k)?3.5:1.5, ac=k=>hl(k)?'var(--hl2)':'var(--ink)', hc=k=>hl(k)?'var(--hl2)':'var(--red)';
    const ns='vector-effect="non-scaling-stroke"';
    // zones tactiles : au moins 30 px à l'écran, réduites aux extrémités pour ne pas se chevaucher
    const seg=(P,Q,t0,t1)=>`x1="${P[0]+(Q[0]-P[0])*t0}" y1="${P[1]+(Q[1]-P[1])*t0}" x2="${P[0]+(Q[0]-P[0])*t1}" y2="${P[1]+(Q[1]-P[1])*t1}"`;
    tSvg.innerHTML=`
      <g opacity="${op}">
      <path d="M${A} L${C} L${B} Z" fill="var(--tri)" stroke="none"/>
      <line x1="${C[0]}" y1="${C[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${hc('a')}" stroke-width="${sw('a')}" stroke-linecap="round" ${ns}/>
      <line x1="${A[0]}" y1="${A[1]}" x2="${C[0]}" y2="${C[1]}" stroke="${hc('b')}" stroke-width="${sw('b')}" stroke-linecap="round" ${ns}/>
      <line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${hc('c')}" stroke-width="${sw('c')}" stroke-linecap="round" ${ns}/>
      <path d="M${C[0]-sq} ${C[1]} V${C[1]-sq} H${C[0]}" fill="none" stroke="var(--ink)" stroke-width="1.5" ${ns}/>
      <path d="${arc(A,0,r.al,ra)}" fill="none" stroke="${ac('al')}" stroke-width="${aw('al')}" ${ns}/>
      <path d="${arc(B,270-r.be,r.be,rb)}" fill="none" stroke="${ac('be')}" stroke-width="${aw('be')}" ${ns}/>
      </g>
      <g class="hits" fill="none" stroke="transparent" pointer-events="stroke" stroke-width="${30*u}">
        <line class="hit" data-k="a" ${seg(C,B,.15,.85)}/>
        <line class="hit" data-k="b" ${seg(A,C,.25,.85)}/>
        <line class="hit" data-k="c" ${seg(A,B,.2,.85)}/>
      </g>
      <g class="hits" fill="transparent">
        <circle class="hit" data-k="al" cx="${A[0]}" cy="${A[1]}" r="${Math.min(30*u,Math.max(bw,ah)*.25+10*u)}"/>
        <circle class="hit" data-k="be" cx="${B[0]}" cy="${B[1]}" r="${Math.min(26*u,Math.max(bw,ah)*.25+10*u)}"/>
      </g>
      <g font-family="IBM Plex Mono, monospace" fill="var(--ink)" pointer-events="none">
        <text x="${A[0]-10*u}" y="${A[1]+18*u}" font-size="${13*u}" font-weight="600">A</text>
        <text x="${C[0]+4*u}" y="${C[1]+18*u}" font-size="${13*u}" font-weight="600">C</text>
        <text x="${B[0]+6*u}" y="${B[1]-6*u}" font-size="${13*u}" font-weight="600">B</text>
        <text x="${(A[0]+C[0])/2}" y="${oy+22*u}" font-size="${12*u}" text-anchor="middle"><tspan font-weight="600">b</tspan> ${res?'= '+L('b'):''}</text>
        <text x="${C[0]+8*u}" y="${(B[1]+C[1])/2+4*u}" font-size="${12*u}"><tspan font-weight="600">a</tspan></text>
        ${res?`<text x="${C[0]+8*u}" y="${(B[1]+C[1])/2+19*u}" font-size="${12*u}">${L('a')}</text>`:''}
        <text x="${hx+nx/nl*14*u}" y="${hy+ny/nl*14*u}" font-size="${12*u}" text-anchor="end"><tspan font-weight="600">c</tspan> ${res?'= '+L('c'):''}</text>
        <text x="${A[0]+ra+6*u}" y="${A[1]-5*u}" font-size="${11*u}" fill="var(--red)">${G('al')}</text>
        <text x="${B[0]-6*u}" y="${B[1]+rb+14*u}" font-size="${11*u}" fill="var(--red)" text-anchor="end">${G('be')}</text>
      </g>`;
  }

  Object.entries(F).forEach(([key,inp])=>{
    inp.addEventListener('input',()=>{ order=order.filter(x=>x!==key); order.push(key); solve(); });
    addClear(inp,()=>{ order=order.filter(x=>x!==key&&isFinite(parse(F[x].value))); if(order.length>1) order=order.slice(-1);
      for(const x in F) if(!order.includes(x)){ F[x].value=''; F[x].classList.remove('calc'); } solve(); });
    inp.addEventListener('focus',()=>{ active=key; inp.closest('.f').classList.add('on'); draw(); });
    inp.addEventListener('blur',()=>{ inp.closest('.f').classList.remove('on'); setTimeout(()=>{ if(active===key&&document.activeElement!==inp){active=null;draw();} },0); });
  });
  // Toucher un côté ou un angle du dessin = saisir cette valeur
  tZoom.onclick=()=>setVB({...VB0});
  tSvg.addEventListener('click',e=>{ if(moved){ moved=false; return; } const h=e.target.closest('[data-k]'); if(!h) return; const inp=F[h.dataset.k]; inp.focus({preventScroll:true}); inp.select(); });
  tR.onclick=()=>{ for(const x in F){F[x].value='';F[x].classList.remove('calc');} order=[]; solve(); };
  // Liseré sous le triangle quand il reste collé en haut
  const io=new IntersectionObserver(([en])=>tStage.classList.toggle('stuck',en.intersectionRatio<1),{rootMargin:`-${(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hc'))||52)+1}px 0px 0px 0px`,threshold:[1]});
  io.observe(tStage);
  setUnitUI();
  // Exemple de départ : côtés de 300 et 400 (mm)
  ta.value=fmtIn(300/UNITS[unit],4); tb.value=fmtIn(400/UNITS[unit],4); order=['a','b']; solve();
}

// ---------- TARAUDAGE : filetage métrique ISO à pas gros ----------
// Diamètre de perçage = diamètre nominal − pas (règle ISO pour un taraud à coupe)
const METRIC=[[.3,.075],[.35,.09],[.4,.1],[.45,.1],[.5,.125],[.55,.125],[.6,.15],[.7,.175],[.8,.2],[.9,.225],[1,.25],[1.2,.25],[1.4,.3],[1.6,.35],[2,.4],[2.5,.45],[3,.5],[3.5,.6],[4,.7],[5,.8],[6,1],[7,1],[8,1.25],[10,1.5],[12,1.75],[14,2],[16,2],[18,2.5],[20,2.5],[22,2.5],[24,3],[27,3],[30,3.5],[33,3.5],[36,4],[42,4.5],[48,5],[56,5.5],[64,6]];
const COMMON=new Set([3,4,5,6,8,10,12,16,20]);
// Foret du commerce : D − pas arrondi au centième supérieur, sauf M8 et M12 où l'usage (DIN 336) retient 6,8 et 10,2
const DRILL_STD={8:6.8,12:10.2};
const tapDrill=(D,P)=>DRILL_STD[D]!=null?DRILL_STD[D]:Math.ceil(Math.round((D-P)*1000)/10-1e-9)/100;
function renderTap(view){
  let sel=Number(store('tapSel'))||8;
  if(!METRIC.some(m=>m[0]===sel)) sel=8;
  view.append(el(`<section class="card">
    <h2>Taraudage métrique · pas gros</h2>
    <div class="tapsel" id="tapSel" aria-live="polite"></div>
    <p class="hint" style="margin:0">Touche « Taraud » ou une ligne pour choisir la taille. Point rouge : tailles les plus courantes. De M0,3 à M0,9 : micro-filetages (horlogerie, électronique).</p>
    <div class="taplist" role="list" id="tapList"></div>
  </section>`));
  const list=document.getElementById('tapList'), box=document.getElementById('tapSel');
  const d=tapDrill;
  list.innerHTML=`<div class="taprow head" aria-hidden="true"><span>Taraud</span><span>Pas</span><span>Ø perçage</span></div>`+
    METRIC.map(([D,P])=>`<button class="taprow" role="listitem" data-d="${D}"><span class="tn">${COMMON.has(D)?'<i class="dot" title="Taille courante"></i>':''}M${fmt(D,2)}</span><span>${fmt(P,3)}</span><span class="dr">${fmt(d(D,P),3)}</span></button>`).join('');
  box.innerHTML=`<label class="big pick" for="tapPick"><span>Taraud</span><strong id="tapN"></strong>
      <select id="tapPick" aria-label="Choisir la taille du taraud">${METRIC.map(([D])=>`<option value="${D}">M${fmt(D,2)}</option>`).join('')}</select></label>
    <div class="big"><span>Pas</span><strong id="tapP"></strong></div>
    <div class="big main"><span>Foret</span><strong id="tapD"></strong></div>`;
  const pick=document.getElementById('tapPick');
  function paint(scroll){
    const [D,P]=METRIC.find(m=>m[0]===sel);
    tapN.textContent='M'+fmt(D,2); pick.value=String(D);
    tapP.innerHTML=`${fmt(P,3)}<small> mm</small>`;
    tapD.innerHTML=`Ø ${fmt(d(D,P),3)}<small> mm</small>`;
    list.querySelectorAll('[data-d]').forEach(b=>{ const on=Number(b.dataset.d)===sel; b.setAttribute('aria-current',on); if(on&&scroll) b.scrollIntoView({block:'center',behavior:'smooth'}); });
  }
  const choose=(v,scroll)=>{ sel=Number(v); store('tapSel',sel); paint(scroll); };
  pick.addEventListener('change',()=>choose(pick.value,true));
  list.addEventListener('click',e=>{ const b=e.target.closest('[data-d]'); if(b) choose(b.dataset.d,false); });
  paint();
}

// ----- Vue 3D isométrique du foret (three.js) -----
// Géométrie : profil polaire à 2 goujures balayé en hélice (30°), pointe conique 118°, queue cylindrique chanfreinée.
const PART_CATS={queue:[0],corps:[1,2,3,4],goujure:[1],listel:[2],depouille:[3],face:[4],pointe:[4]};
const CAT_PART=['queue','goujure','listel','depouille','face'];
function initDrill3D(box,onPick){
  if(!window.THREE){ box.hidden=true; return {set(){}}; }
  const T=THREE, R=.5, Lb=6, Ls=3.6, TR=.9, lead=Math.PI*2*R/Math.tan(30*Math.PI/180), tanP=Math.tan(59*Math.PI/180);
  const J=240, K=200, M=28, rw=.17*R, Rl=.965*R;
  // profil : 0 queue, 1 goujure, 2 listel, 3 dépouille, 4 pointe
  const prof=[];
  for(let j=0;j<J;j++){
    const th=j/J*Math.PI*2, u=(th%Math.PI)/Math.PI; let r,c;
    if(u<.07){ r=R; c=2; }
    else if(u<.45){ r=Rl; c=3; }
    else { const t=(u-.45)/.55, sh=t<.55?Math.pow(Math.sin(Math.PI/2*t/.55),1.1):Math.pow(Math.cos(Math.PI/2*(t-.55)/.45),.75); r=Rl-(Rl-rw)*sh; c=1; }
    prof.push({th,r,c});
  }
  const pos=(x,r,th)=>{ const phi=th+x/lead*Math.PI*2; return [x,r*Math.cos(phi),r*Math.sin(phi)]; };
  function grid(rows,fn){ // rows×J sommets, maillage fermé en j
    const P=new Float32Array(rows*J*3), cats=new Uint8Array(rows*J), idx=[];
    for(let k=0;k<rows;k++) for(let j=0;j<J;j++){ const v=fn(k,j); P.set(v.p,(k*J+j)*3); cats[k*J+j]=v.c; }
    for(let k=0;k<rows-1;k++) for(let j=0;j<J;j++){ const a=k*J+j,b=k*J+(j+1)%J,c=(k+1)*J+j,d=(k+1)*J+(j+1)%J; idx.push(a,c,b,b,c,d); }
    const g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(P,3)); g.setIndex(idx); g.computeVertexNormals();
    g.setAttribute('color',new T.BufferAttribute(new Float32Array(rows*J*3),3)); return {g,cats};
  }
  const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  const body=grid(K+1,(k,j)=>{ const p=prof[j], zEnd=Lb+(R-p.r)/tanP, x=zEnd*k/K, f=smooth(x/TR), r=R+(p.r-R)*f; return {p:pos(x,r,p.th),c:f<.3?3:p.c}; });
  const tip=grid(M+1,(m,j)=>{ const p=prof[j], r=p.r*(1-m/M); return {p:pos(Lb+(R-r)/tanP,r,p.th),c:4}; });
  const shank=(()=>{ const pts=[[0,-Ls],[R-.06,-Ls],[R,-Ls+.06],[R,0]].map(([r,h])=>new T.Vector2(r,h));
    const g=new T.LatheGeometry(pts,96); g.rotateZ(-Math.PI/2); g.computeVertexNormals();
    const n=g.attributes.position.count; g.setAttribute('color',new T.BufferAttribute(new Float32Array(n*3),3)); return {g,cats:new Uint8Array(n)}; })();
  const BASE=[new T.Color('#c4bfbc'),new T.Color('#8f8a88'),new T.Color('#e4e1df'),new T.Color('#a9a4a1'),new T.Color('#b9b4b1')], HL=new T.Color('#e0473e');
  const mat=new T.MeshStandardMaterial({vertexColors:true,metalness:.35,roughness:.33,side:T.DoubleSide});
  const meshes=[body,tip,shank].map(o=>{ const m=new T.Mesh(o.g,mat); m.userData.cats=o.cats; return m; });
  const spin=new T.Group(); meshes.forEach(m=>spin.add(m));
  spin.position.x=-(Lb+R/tanP-Ls)/2;
  const turn=new T.Group(); turn.add(spin);
  const scene=new T.Scene(); scene.add(turn);
  scene.add(new T.HemisphereLight(0xffffff,0x3a3330,.75));
  const d1=new T.DirectionalLight(0xffffff,.95); d1.position.set(4,9,6); scene.add(d1);
  const d2=new T.DirectionalLight(0xffe6dd,.35); d2.position.set(-6,-2,-5); scene.add(d2);
  const cam=new T.OrthographicCamera(-1,1,1,-1,.1,100); cam.position.set(12,9.8,12); cam.lookAt(0,0,0);
  turn.rotation.y=Math.PI/4-.35; // la longueur du foret à plat, vue en 3/4
  const ren=new T.WebGLRenderer({antialias:true,alpha:true}); ren.setPixelRatio(Math.min(devicePixelRatio||1,2));
  if('outputEncoding' in ren) ren.outputEncoding=T.sRGBEncoding;
  box.appendChild(ren.domElement);
  function resize(){ const w=box.clientWidth, h=Math.round(w*.5); if(!w) return; ren.setSize(w,h,false); ren.domElement.style.width='100%'; ren.domElement.style.height='auto';
    const hw=5.6, hh=hw*h/w; cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh; cam.updateProjectionMatrix(); draw(); }
  let sel=null;
  function set(part){ sel=part; const on=new Set(PART_CATS[part]||[]);
    meshes.forEach(m=>{ const col=m.geometry.attributes.color, c=m.userData.cats; for(let i=0;i<c.length;i++){ const k=on.has(c[i])?HL:BASE[c[i]]; col.setXYZ(i,k.r,k.g,k.b);} col.needsUpdate=true; }); draw(); }
  function draw(){ ren.render(scene,cam); }
  // interactions : glisser = tourner, toucher = sélectionner la zone
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let drag=null, idle=0, visible=true;
  const cv=ren.domElement; cv.style.touchAction='pan-y'; cv.style.cursor='grab';
  cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,ry:turn.rotation.y,rx:spin.rotation.x,moved:false}; });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>6){ drag.moved=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} }
    if(drag.moved){ turn.rotation.y=drag.ry+dx*.012; spin.rotation.x=drag.rx+dy*.012*(e.pointerType==='mouse'?1:0); draw(); idle=performance.now(); } });
  const up=e=>{ if(drag&&!drag.moved){ const r=cv.getBoundingClientRect(), ray=new T.Raycaster();
      ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);
      const hit=ray.intersectObjects(meshes)[0]; if(hit) onPick(CAT_PART[hit.object.userData.cats[hit.face.a]]); }
    drag=null; idle=performance.now(); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',()=>{drag=null;});
  new IntersectionObserver(([en])=>{ visible=en.isIntersecting; }).observe(box);
  (function loop(t){ if(!box.isConnected) return; requestAnimationFrame(loop);
    if(!reduce&&visible&&!drag&&t-idle>1500){ spin.rotation.x+=.006; draw(); } })(0);
  new ResizeObserver(resize).observe(box); resize();
  return {set};
}

// ---------- CALCUL : calculatrice, fractions exactes, historique ----------
// Les nombres restent des fractions exactes (BigInt) tant que possible : 3/4 + 1/6 = 11/12, 8×5,82 = 46,56 sans erreur d'arrondi.
// Les fonctions (sin, √2, log…) passent en décimal (12 chiffres significatifs).
const MINUS='−';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const bgcd=(a,b)=>{ if(a<0n)a=-a; if(b<0n)b=-b; while(b){ const t=a%b; a=b; b=t; } return a; };
function Q(n,d=1n){ if(d===0n) throw new Error('Division par zéro'); if(d<0n){n=-n;d=-d;} const g=bgcd(n,d); return g>1n?{n:n/g,d:d/g}:{n,d}; }
const isQ=v=>!!v&&v.n!==undefined;
const dig=x=>(x<0n?-x:x).toString().length;
function qNum(q){ const k=Math.max(0,Math.max(dig(q.n),dig(q.d))-300); if(!k) return Number(q.n)/Number(q.d); const s=10n**BigInt(k); return Number(q.n/s)/Number(q.d/s); }
const toF=v=>isQ(v)?qNum(v):v.f;
function Fl(x){ if(Number.isNaN(x)) throw new Error('Calcul impossible'); if(!isFinite(x)) throw new Error('Nombre trop grand'); return {f:x}; }
const cap=v=>isQ(v)&&(dig(v.n)>400||dig(v.d)>400)?Fl(qNum(v)):v;
const both=(a,b)=>isQ(a)&&isQ(b);
const cAdd=(a,b)=>both(a,b)?Q(a.n*b.d+b.n*a.d,a.d*b.d):Fl(toF(a)+toF(b));
const cSub=(a,b)=>both(a,b)?Q(a.n*b.d-b.n*a.d,a.d*b.d):Fl(toF(a)-toF(b));
const cMul=(a,b)=>cap(both(a,b)?Q(a.n*b.n,a.d*b.d):Fl(toF(a)*toF(b)));
const cDiv=(a,b)=>{ if(isQ(b)?b.n===0n:toF(b)===0) throw new Error('Division par zéro'); return cap(both(a,b)?Q(a.n*b.d,a.d*b.n):Fl(toF(a)/toF(b))); };
const cNeg=a=>isQ(a)?{n:-a.n,d:a.d}:{f:-a.f};
function isqrt(n){ if(n<2n) return n; let x=1n<<BigInt(Math.ceil(n.toString(2).length/2)); for(;;){ const y=(x+n/x)>>1n; if(y>=x) return x; x=y; } }
function cSqrt(a){ if(toF(a)<0) throw new Error("Racine d'un nombre négatif"); if(isQ(a)){ const r=isqrt(a.n), s=isqrt(a.d); if(r*r===a.n&&s*s===a.d) return {n:r,d:s}; } return Fl(Math.sqrt(toF(a))); }
function cPow(a,b){
  if(both(a,b)&&b.d===1n){ const e=b.n<0n?-b.n:b.n;
    if(e<=4000n&&(dig(a.n)+dig(a.d))*Number(e)<4000){ let r={n:a.n**e,d:a.d**e}; if(b.n<0n){ if(r.n===0n) throw new Error('Division par zéro'); r=Q(r.d,r.n); } return r; } }
  return Fl(Math.pow(toF(a),toF(b)));
}
function cNum(s){
  const m=/^(\d*)(?:,(\d*))?(?:[Ee]([+\-−]?)(\d+))?$/.exec(s.replace('.',',')); if(!m) throw new Error('Nombre incorrect');
  const fr=m[2]||''; let n=BigInt((m[1]||'0')+fr), d=10n**BigInt(fr.length);
  if(m[4]!==undefined){ const e=Number(m[4]); if(e>400) throw new Error('Nombre trop grand'); const p=10n**BigInt(e); if(m[3]==='-'||m[3]===MINUS) d*=p; else n*=p; }
  return Q(n,d);
}
// angles remarquables en degrés : résultat exact
const SIN_DEG={0:[0n,1n],30:[1n,2n],90:[1n,1n],150:[1n,2n],180:[0n,1n],210:[-1n,2n],270:[-1n,1n],330:[-1n,2n]};
const TAN_DEG={0:[0n,1n],45:[1n,1n],135:[-1n,1n],180:[0n,1n],225:[1n,1n],315:[-1n,1n]};
function cFn(name,a,deg){
  const x=toF(a);
  if(name==='sin'||name==='cos'||name==='tan'){
    if(deg&&isQ(a)&&a.d===1n){ let k=Number(((a.n%360n)+360n)%360n); const k0=k; if(name==='cos') k=(k+90)%360;
      if(name==='tan'){ if(k===90||k===270) throw new Error(`La tangente de ${k0}° n'existe pas`); if(TAN_DEG[k]) return Q(...TAN_DEG[k]); }
      else if(SIN_DEG[k]) return Q(...SIN_DEG[k]); }
    const r=deg?x*Math.PI/180:x; let y=name==='sin'?Math.sin(r):name==='cos'?Math.cos(r):Math.tan(r);
    if(Math.abs(y)<1e-13) y=0; if(Math.abs(y)>1e15) throw new Error("La tangente n'existe pas pour cet angle"); return Fl(y);
  }

  </section>`));
  const cx=view.querySelector('.cx'), cHist=cx.querySelector('#cHist'), cIn=cx.querySelector('#cIn'), cPrev=cx.querySelector('#cPrev'), cClr=cx.querySelector('#cClr'), keys=cx.querySelector('#cKeys'), crow=cx.querySelector('.crow');

  function paintIn(){
    cIn.innerHTML=dRender(dTree(expr),caret); balanceFracs(cIn);
    const c=cIn.querySelector('.caret'); if(!c) return;
    const r=c.getBoundingClientRect(), R=cIn.getBoundingClientRect();
    if(r.right>R.right-10) cIn.scrollLeft+=r.right-R.right+20; else if(r.left<R.left+10) cIn.scrollLeft-=R.left-r.left+20;
  }
  function paintHist(scroll){
    cHist.innerHTML=hist.length?hist.map((h,i)=>{ const d=fmtVal(h.v,mode);
      return `<button class="hrow ex" data-h="${i}" data-k="e">${dRender(dTree(h.e),null)}</button><button class="hrow res" data-h="${i}" data-k="r"><span class="hv">${d.html}</span>${d.alt?`<small>${esc(d.alt)}</small>`:''}</button>`; }).join('')
      :'<div class="hempty">Tes calculs s\'affichent ici. Touche un calcul pour le reprendre (ou l\'insérer entre parenthèses dans la saisie en cours), un résultat pour l\'insérer.<br>Appui long sur une touche : à quoi elle sert.</div>';
    cClr.hidden=!hist.length; cClr.textContent='Vider'; cClr.classList.remove('arm');

  }
  function paintModes(){

    cx.querySelectorAll('[data-ang]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.ang==='deg')===deg));
  }
  function update(){
    paintIn(); cPrev.className='prev';
    if(!expr.trim()){ cPrev.textContent=''; return; }
    try{ cPrev.textContent='= '+fmtVal(calcEval(expr,ctx),mode).text; }catch(_){ cPrev.textContent=''; }
  }
  const TOKL=/(sin\(|cos\(|tan\(|log\(|ln\(|√\(|Ans)$/, TOKR=/^(sin\(|cos\(|tan\(|log\(|ln\(|√\(|Ans)/;
  function ins(s){ expr=expr.slice(0,caret)+s+expr.slice(caret); caret+=s.length; update(); }
  function back(){
    if(!caret) return; const s=expr, c=s[caret-1];
    if(c==='⦄'){ caret--; return update(); }                      // entrer dans la case par la droite
    if(c==='⦃'){ const o=caret-1, cl=dMatchF(s,o,'⦃','⦄'), end=cl<0?s.length:cl, body=s.slice(o+1,end), after=cl<0?s.length:cl+1;
      if(s[o-1]==='÷'&&s[o-2]==='⦄'){ const no=dMatchB(s,o-2,'⦃','⦄');   // début du dénominateur
        if(!body&&no>=0){ const num=s.slice(no+1,o-2); expr=s.slice(0,no)+num+s.slice(after); caret=no+num.length; }  // dénominateur vide : on défait la fraction
        else caret=o-2;
        return update(); }
      if(s[o-1]==='^'){ if(!body){ expr=s.slice(0,o-1)+s.slice(after); } caret=o-1; return update(); }   // début de l'exposant
      if(cl>=0&&s[cl+1]==='÷'&&s[cl+2]==='⦃'){ const dc=dMatchF(s,cl+2,'⦃','⦄'), den=s.slice(cl+3,dc<0?s.length:dc);   // début du numérateur
        if(!body&&!den){ expr=s.slice(0,o)+s.slice(dc<0?s.length:dc+1); caret=o; return update(); } }
      caret=o; return update(); }
    const m=TOKL.exec(s.slice(0,caret)), n=m?m[0].length:1; expr=s.slice(0,caret-n)+s.slice(caret); caret-=n; update(); }

    if(c==='⦃'||c==='⦄'||((c==='÷'||c==='^')&&expr[caret+1]==='⦃')) return move(1);
    const m=TOKR.exec(expr.slice(caret)), n=m?m[0].length:1; expr=expr.slice(0,caret)+expr.slice(caret+n); update(); }
  function move(d){ caret+=d; while(caret>0&&caret<expr.length&&!dCanon(expr,caret)) caret+=d; caret=Math.max(0,Math.min(expr.length,caret)); update(); }
  function clearAll(){ expr=''; caret=0; update(); }
  function enter(){ if(!expr.trim()) return;
    try{ const v=calcEval(expr,ctx); hist.push({e:expr,v}); if(hist.length>100) hist.shift(); save(); expr=''; caret=0; paintHist(true); update(); }
    catch(err){ cPrev.textContent=err.message; cPrev.className='prev err'; cIn.classList.remove('shake'); void cIn.offsetWidth; cIn.classList.add('shake'); }
  }
  function press(v){
    if(v==='#eq') return enter();

    if(v==='÷'){ const st=dAtomStart(expr,caret);              // fraction : ce qui précède passe au numérateur, le curseur va au dénominateur
      if(st<0){ expr=expr.slice(0,caret)+'⦃⦄÷⦃⦄'+expr.slice(caret); caret+=1; }

    ins(v);
  }

  // ----- Menu des puissances (appui long sur x²) -----
  function closePow(){ keys.querySelectorAll('.pmenu').forEach(m=>m.remove()); }
  function openPow(b){ closePow();
    const n=Math.max(6,Math.floor((keys.clientWidth+6)/50));
    const m=el(`<div class="pmenu" role="menu" aria-label="Puissances" style="top:${b.offsetTop}px;height:${b.offsetHeight}px;grid-template-columns:repeat(${n},minmax(0,1fr))">${Array.from({length:n},(_,i)=>i+3).map(k=>`<button class="k" role="menuitem" data-v="^${k}">x${supN(k)}</button>`).join('')}</div>`);

  }
  const offPow=e=>{ if(!cx.isConnected) return document.removeEventListener('pointerdown',offPow,true); if(!e.target.closest('.pmenu')) closePow(); };
  document.addEventListener('pointerdown',offPow,true);

  // ----- Touches : appui court = saisie, appui long = aide / puissances / effacement complet -----
  let lp=null;
  const stop=()=>{ if(lp){ lp.timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); lp.b.classList.remove('down'); } };
  keys.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.k'); if(!b||e.button>0) return; stop();
    const v=b.dataset.v; lp={b,v,x:e.clientX,y:e.clientY,long:false,timers:[]}; b.classList.add('down'); haptic('key');

    else if(v==='²') lp.timers.push(setTimeout(()=>{ lp.long=true; openPow(b); buzz(); },450));

  });

  keys.addEventListener('click',e=>{ if(e.detail===0){ const b=e.target.closest('.k'); if(b) press(b.dataset.v); } });   // clavier (Entrée/Espace)

  ['pointerup','pointercancel','pointerleave'].forEach(ev=>crow.addEventListener(ev,()=>clearTimeout(cl)));
  crow.addEventListener('click',e=>{ if(skipClick){ skipClick=false; return; } const b=e.target.closest('button'); if(!b) return;

const MAT_INFO={
 '#Aciers patinables (Corten)':{p:['Corten® est le nom commercial courant (marque d\'origine U.S. Steel) des aciers patinables normalisés EN 10025-5. Corten A correspond au S355J0WP (avec phosphore, surtout en tôles fines), Corten B au S355J2W.','La patine se forme en quelques mois d\'alternance pluie / séchage. Elle ne protège pas en milieu immergé, très humide en continu ou salin concentré. Les angles d\'écoulement tachent le support en dessous.','Soudage : fils et électrodes patinables pour garder le même aspect et la même tenue.'],
  kv:[['Norme','EN 10025-5 (aciers de construction à résistance améliorée à la corrosion atmosphérique)'],['Éléments d\'alliage','Cu, Cr, Ni (et P pour le S355J0WP)'],['Limite élastique','≥ 355 MPa (épaisseurs courantes)'],['Usinage','Comme un acier de construction S355 (groupe ISO P)']]},
 'AISI 304':{p:['Inox austénitique le plus courant, appelé aussi 18/8 ou 18/10 (≈ 18 % de chrome et 8 à 10 % de nickel). Les deux appellations désignent la même famille, normalisée 1.4301 (X5CrNi18-10, nickel 8 à 10,5 %). Ce n\'est pas une différence entre l\'Europe et les États-Unis : les deux noms sont utilisés partout.','Le 18/10, un peu plus riche en nickel, est en général choisi pour la vaisselle et les couverts haut de gamme (aspect plus brillant, résistance à la corrosion légèrement meilleure). En usage courant, la différence est faible ; les deux conviennent au contact alimentaire.'],
  kv:[['Équivalences','AISI 304 · 1.4301 · X5CrNi18-10 · « 18/8 », « 18/10 »'],['Composition','Cr 17,5–19,5 % · Ni 8–10,5 % · C ≤ 0,07 %'],['Version bas carbone','304L (1.4307) : meilleure soudabilité']]},
 'Or fin 999':{p:['Or pur à 99,9 % : très mou, très dense et inaltérable à l\'air. Il ne s\'oxyde pas et ne réagit avec aucun acide pris seul.','Il se dissout dans l\'eau régale (voir « Traitements et chimie » plus bas).'],
  kv:[['Titre','999 ‰'],['Densité','19,3 g/cm³'],['Usages','Lingots, contacts et fils électroniques, dorure']]},
 'Or 750':{p:['Or 18 carats : 75 % d\'or allié au cuivre et à l\'argent (or jaune, rose) ou au palladium / nickel (or gris). Plus dur que l\'or fin, c\'est le titre usuel de la bijouterie française.'],
  kv:[['Titre','750 ‰ (18 carats)'],['Autres titres','585 ‰ (14 ct) · 375 ‰ (9 ct)']]},
 '#Polyimides (Vespel®)':{p:['Polyimide DuPont™ Vespel®. Il garde une bonne résistance mécanique depuis les températures cryogéniques jusqu\'à environ 260 °C en continu ; des pointes de courte durée bien plus élevées sont annoncées par le fabricant.','Résistance à l\'oxydation thermique, excellente tenue à l\'usure et au frottement (charge × vitesse admissible à sec : PV ≈ 12 MPa·m/s pour les nuances graphitées), très bonne isolation thermique et électrique, faible absorption d\'humidité, bonne résistance aux radiations, faible dégazage sous vide, naturellement peu inflammable.','Gammes : S (pièces frittées, tribologie et thermique), SCP, TP (thermoplastique, formes plus libres), CP (composites renforcés fibres ou tissus), CR (fluorocarbonée, résistance chimique : joints, bagues de pompes) et ASB (assemblages de plusieurs matériaux). Il existe de nombreuses nuances.'],
  kv:[['Température','Cryogénique → ≈ 260 °C en continu'],['PV à sec','≈ 12,3 MPa·m/s (SP-21, SP-211)'],['Dilatation (23–300 °C)','SP-1 : 54 µm/m·K · SP-22 : 38 µm/m·K (alu ≈ 23, acier ≈ 12)'],['Absorption d\'eau (24 h)','SP-1 : 0,24 % · SP-22 : 0,14 %'],['Charges','SP-1 sans charge · SP-21 15 % graphite · SP-22 40 % graphite · SP-211 15 % graphite + 10 % PTFE']]},
 '#Ébonite':{p:['Matériau dur obtenu en vulcanisant le caoutchouc avec une forte proportion de soufre (environ 20 à 40 %). En anglais on dit « hard rubber », ce qui entraîne souvent des erreurs de traduction avec « rubber » (caoutchouc).','Solide noir, dur et cassant. Il peut recevoir des charges (craie, magnésie, oxydes métalliques, baryte…). Il se tourne comme du bois et se polit.','Applications : isolants électriques, tuyaux de pipe, becs de clarinette et de saxophone, stylos-plume, anciennes boules de bowling, premiers disques (avant la gomme-laque des 78 tours puis le vinyle). Dans le nucléaire, la ceinture de criticité portée par les travailleurs contient 6 pastilles d\'ébonite : après un accident de criticité, elle permet de déterminer l\'orientation de la personne dans le champ de rayonnement.'],
  kv:[['Soufre','≈ 20 à 40 %'],['Usinage','Outils vifs, poussière abrasive : aspiration conseillée']]},
 'Titane Grade 23':{p:['Version ELI (« Extra Low Interstitials ») du Grade 5 : moins d\'oxygène et de fer, donc meilleure ténacité et meilleure tenue en fatigue.','Implantable et biocompatible. Surtout utilisé dans le médical (implants chirurgicaux et dentaires), mais aussi dans l\'industrie (aéronautique, cryogénie).'],
  kv:[['Normes','ISO 5832-3 et ASTM F136 (produits corroyés pour implants chirurgicaux) · ASTM B348 Grade 23 (barres)'],['Composition','Ti base · Al ≈ 6 % · V ≈ 4 % · O ≤ 0,13 %'],['Densité','4,43 g/cm³'],['Résistance (ASTM F136)','Rm ≥ 860 MPa · Rp0,2 ≥ 795 MPa · A ≥ 10 %'],['Usinage','Groupe ISO S : vitesse de coupe basse, arrosage abondant, outils carbure à arête vive']]},
 'Argent fin 999':{p:['Argent pur à 99,9 % : relativement mou, c\'est pourquoi on l\'allie le plus souvent au cuivre pour le durcir.','C\'est le meilleur conducteur de l\'électricité et de la chaleur parmi les métaux : contacts électriques, revêtements, bijouterie.'],
  kv:[['Titre','999 ‰ minimum'],['Densité','≈ 10,5 g/cm³']]},
 'Argent sterling 925':{p:['Alliage contenant 92,5 % en poids d\'argent et 7,5 % d\'autres métaux, généralement du cuivre.','Il ternit à l\'air. Pour réduire le ternissement, la porosité des pièces coulées et les taches de feu (oxydation du cuivre au chauffage), le cuivre est parfois remplacé en partie par du germanium, du zinc, du platine, du silicium ou du bore. Exemple : l\'Argentium®, au germanium.'],
  kv:[['Titre','925 ‰ minimum'],['Composition','Ag 92,5 % · autres métaux 7,5 % (surtout Cu)'],['Densité','≈ 10,4 g/cm³'],['Usages','Bijouterie, orfèvrerie, couverts']]},
 'Stellite® 6':{p:['Alliage dont le composant principal est le cobalt et l\'élément d\'alliage principal le chrome, avec un peu de tungstène ou de molybdène et de carbone. Les carbures formés lui donnent sa résistance à l\'usure, à la corrosion et à la chaleur. Stellite 6 est la nuance la plus répandue.','La plupart des nuances ne se forgent pas : pièces moulées, ou stellite déposé sur le corps de la pièce par rechargement (chalumeau, TIG, plasma PTA) ou par projection (HVOF). Il existe aussi une version corroyée, Stellite 6B, en tôles et en barres.','Applications : sièges de soupapes et de vannes, dents de scies à bois, boucliers anti-érosion sur le bord d\'attaque des aubes de turbines à vapeur (derniers étages, érosion par les gouttelettes d\'eau).'],
  kv:[['Composition (Stellite 6)','Co base · Cr 27–32 % · W 3–6 % · C 0,9–1,4 %'],['Densité','8,44 g/cm³'],['Dureté','36 à 45 HRC en rechargement'],['Marque','Stellite® (Kennametal)'],['Usinage','Très difficile : souvent rectifié. Groupe ISO S (H pour les couches les plus dures)']]},
 'Denal®':{p:['Nom commercial d\'alliages lourds de tungstène de Cime Bocuze (groupe Plansee, Haute-Savoie) : tungstène fritté avec un liant nickel-fer ou nickel-cuivre. Les nuances à liant nickel-cuivre sont amagnétiques.','Très haute densité (plus que le plomb), bonne résistance et grande rigidité : son module d\'élasticité est bien supérieur à celui de l\'acier. C\'est ce qui en fait une matière antivibratoire, idéale pour les barres d\'alésage et les porte-outils longs.','Autres usages : masses d\'équilibrage, contrepoids, protection contre les rayonnements.'],
  kv:[['Composition','≈ 90 à 97 % W + liant Ni-Fe ou Ni-Cu, selon la nuance'],['Densité','≈ 17 à 18,5 g/cm³ selon la teneur en W'],['Usinage','Au carbure, copeaux courts (un peu comme la fonte grise)']]},
 'Densimet® 176':{p:['Alliage lourd de tungstène de Plansee. Le nombre 176 correspond à la densité nominale : 17,6 g/cm³.','Mêmes usages que le Denal® : barres d\'alésage antivibratoires, masses, contrepoids, protections.'],
  kv:[['Composition','W 91,5–93,5 % · Ni 4,5–5,5 % · Fe 2–3 %'],['Densité','17,15 à 17,85 g/cm³'],['Résistance','Rm ≥ 758 MPa · Rp0,2 ≥ 517 MPa · A ≥ 5 %']]},
 '#Maillechorts (Cu-Ni-Zn)':{p:['Alliage de cuivre (45 à 75 %), de zinc (5 à 45 %) et de nickel (6 à 26 %), avec parfois des additions de plomb, de manganèse ou de fer. Aussi appelé argentan ou « nickel silver » : il ne contient pas d\'argent, son nom vient de sa couleur.','Facile à déformer à froid et résistant à la corrosion : orfèvrerie (souvent argenté), micromécanique, ressorts, clés et instruments de musique, connecteurs.','Chez Selmer, la bague de serrage réglable du bocal des saxophones Signature est en maillechort.'],
