plugins {
    id 'com.android.application'
}

// Version : passée par la compilation automatique (-PappVersion=1.6 -PappCode=16), sinon valeur de secours
def appVersion = project.findProperty('appVersion') ?: '0.0'
def appCode = (project.findProperty('appCode') ?: '1') as int

android {
    namespace 'fr.utillage.caisseoutils'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.utillage.caisseoutils'
        minSdk 21
        targetSdk 34
        versionCode appCode
        versionName appVersion
    }

    signingConfigs {
        // Clé d'essai fixe (dans le dépôt) : toutes les compilations ont la même signature,
        // donc une nouvelle version s'installe par-dessus l'ancienne sans désinstaller.
        // À remplacer par une vraie clé privée avant toute diffusion publique.
        essai {
            storeFile file('essai.keystore')
            storePassword 'caisse-outils'
            keyAlias 'essai'
            keyPassword 'caisse-outils'
        }
    }

    // Clé privée : fournie par la compilation automatique à partir des secrets GitHub
    // (CLE_SIGNATURE_BASE64 et CLE_SIGNATURE_MDP). Sans eux, on retombe sur la clé d'essai.
    def clePrivee = System.getenv('CLE_FICHIER')
    def cleMdp = System.getenv('CLE_MDP')
    def avecClePrivee = clePrivee && cleMdp && file(clePrivee).exists()
    if (avecClePrivee) {
        signingConfigs {
            privee {
                storeFile file(clePrivee)
                storePassword cleMdp
                keyAlias 'caisse-outils'
                keyPassword cleMdp
            }
        }
    }
    def signature = avecClePrivee ? signingConfigs.privee : signingConfigs.essai

    buildTypes {
        debug { signingConfig signature }
        release {
            signingConfig signature
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
